# Tags produce draft releases for review. Manual runs produce build artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install check dependencies
        run: npm ci --ignore-scripts
      - name: Prepare default app data
        run: node scripts/prepare-app.cjs
      - name: Verify launcher behavior
        run: node scripts/check-launcher.cjs
      - name: Package Home and Control Centre
        run: |
          mkdir -p build/packages
          node scripts/build-control-centre.cjs
          npx --yes --package @webos-tools/cli@3.2.6 ares-package app -o build/packages
          npx --yes --package @webos-tools/cli@3.2.6 ares-package build/control-centre/app -o build/packages
          cp build/packages/com.gathin.tvhome_*.ipk build/packages/apple-tv-webos.ipk
          cp build/packages/com.gathin.tvcontrolcentre_*.ipk build/packages/apple-tv-webos-control-centre.ipk
          cd build/packages
          sha256sum apple-tv-webos.ipk apple-tv-webos-control-centre.ipk > SHA256SUMS
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-webos
          if-no-files-found: error
          path: |
            build/packages/apple-tv-webos.ipk
            build/packages/apple-tv-webos-control-centre.ipk
            build/packages/SHA256SUMS

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apple-tv-webos
          path: packages
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: packages/*
